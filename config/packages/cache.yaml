framework:
    cache:
        prefix_seed: '%env(PROJECT_NAME)%'
        app: cache.adapter.redis
        default_redis_provider: 'redis://%env(REDIS_HOST)%:%env(REDIS_PORT)%'

        pools:
            # Pool Api tokens
            cache.api_tokens:
                adapter: cache.adapter.redis
                default_lifetime: 86400 # 24 horas
