# 🚀 1. Registramos el controlador global de Login (el que está suelto en src/Infrastructure/API)
API_GLOBAL:
    prefix: /api
    type: attribute
    resource:
        path: ../src/Infrastructure/API
        namespace: App\Infrastructure\API
        # 🚨 Le decimos que NO entre a la subcarpeta V1 para que no se dupliquen las rutas
        exclude: ../src/Infrastructure/API/V1 

# 🚀 2. Registramos de forma independiente la tubería de la Versión 1
API_V1:
    prefix: /api/v1                     # 👈 Clavale el prefijo completo explícito acá
    type: attribute
    resource:
        path: ../src/Infrastructure/API/V1   # 👈 Apunta a la subcarpeta física
        namespace: App\Infrastructure\API\V1 # 👈 Mapea el namespace de PHP
